<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planetary Clock</title>

<style>

body {
    margin: 0;
    background: #050505;
    color: #eee;
    font-family: "Times New Roman", serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* BACK ARROW */
.back-arrow {
    position: fixed;
    top: 15px;
    left: 15px;
    font-size: 2rem;
    color: red;
    text-decoration: none;
    border: 1px solid rgba(255,0,0,0.5);
    padding: 6px 12px;
    border-radius: 6px;
    z-index: 999;
}

.back-arrow:hover {
    background: rgba(255,0,0,0.2);
}

/* SYSTEM */
.system {
    position: relative;
    width: 600px;
    height: 600px;
}

/* SUN */
.sun {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 40px;
    height: 40px;
    background: gold;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 30px gold, 0 0 60px orange;
}

/* ORBITS */
.orbit {
    position: absolute;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

#orbitEarth { width: 260px; height: 260px; }
#orbitMars { width: 360px; height: 360px; }

/* PLANETS */
.planet {
    position: absolute;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
}

#earth {
    background: #44ff88;
    box-shadow: 0 0 12px #44ff88;
}

#mars {
    background: #ff4444;
    box-shadow: 0 0 12px #ff4444;
}

/* INFO BOXES */
.planet-box {
    position: absolute;
    background: rgba(0,0,0,0.85);
    color: #eee;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 6px 10px;
    font-size: 0.75rem;
    border-radius: 6px;
    white-space: nowrap;
}

</style>
</head>

<body>

<a class="back-arrow" href="index.html">←</a>

<div class="system">

    <div class="sun"></div>

    <div id="orbitEarth" class="orbit"></div>
    <div id="orbitMars" class="orbit"></div>

    <div id="earth" class="planet"></div>
    <div id="mars" class="planet"></div>

    <div id="earthBox" class="planet-box"></div>
    <div id="marsBox" class="planet-box"></div>

</div>

<script>

/* ---------- PERKD SYSTEM ---------- */

const seasons = ["Gel","Sat","Adol","Mess","Nix"];
const weekdays = [
    "Saturday","Duday","Treday","Quday",
    "Kinday","Sesday","Sepday","Finday"
];

function getPerKD() {

    const now = new Date();

    /* TIME */
    const realSeconds =
        now.getHours()*3600 +
        now.getMinutes()*60 +
        now.getSeconds();

    const totalUnits = 24 * 64 * 64;
    const unit = (realSeconds / 86400) * totalUnits;

    const hour = Math.floor(unit / (64*64));
    const minute = Math.floor((unit % (64*64)) / 64);
    const second = Math.floor(unit % 64);

    /* ✅ 1–8 hours per phase */
    const displayHour = (hour % 8) + 1;

    let phase = "";
    if (hour < 8) phase = "I.M.";
    else if (hour < 16) phase = "I.D.";
    else phase = "A.V.";

    const timeStr =
        String(displayHour).padStart(2,"0")+":"+
        String(minute).padStart(2,"0")+":"+
        String(second).padStart(2,"0");

    /* DATE */
    const start = new Date(now.getFullYear(),0,0);
    const dayOfYear = Math.floor((now - start)/86400000);

    const seasonIndex = Math.floor((dayOfYear-1)/73);
    const season = seasons[seasonIndex] ?? "???";

    const seasonDay = ((dayOfYear-1)%73)+1;
    const week = Math.floor((seasonDay-1)/8)+1;
    const weekday = weekdays[(seasonDay-1)%8];

    return {
        time: timeStr,
        phase,
        season,
        seasonDay,
        week,
        weekday
    };
}

/* ---------- ORBITS ---------- */

function getDaysSinceJ2000() {
    const now = new Date();
    const J2000 = new Date("2000-01-01T12:00:00Z");
    return (now - J2000) / 86400000;
}

function movePlanet(id, boxId, angle, radius) {

    const rad = angle * Math.PI / 180;

    const x = 300 + Math.cos(rad) * radius;
    const y = 300 + Math.sin(rad) * radius;

    const planet = document.getElementById(id);
    const box = document.getElementById(boxId);

    planet.style.left = x + "px";
    planet.style.top = y + "px";

    box.style.left = (x + 12) + "px";
    box.style.top = (y + 12) + "px";
}

/* ---------- UPDATE ---------- */

function update() {

    const d = getDaysSinceJ2000();

    const earthAngle = (100.4665 + 0.98564736 * d) % 360;
    const marsAngle = (355.433 + 0.52403295 * d) % 360;

    movePlanet("earth","earthBox",earthAngle,130);
    movePlanet("mars","marsBox",marsAngle,180);

    const t = getPerKD();

    const text =
        t.time + "<br>" +
        t.phase + "<br>" +
        t.season + " " + t.seasonDay + "<br>" +
        "W" + t.week + " • " + t.weekday;

    document.getElementById("earthBox").innerHTML =
        "Earth<br>" + text;

    document.getElementById("marsBox").innerHTML =
        "Mars<br>" + text;
}

setInterval(update,50);
update();

</script>

</body>
</html>
