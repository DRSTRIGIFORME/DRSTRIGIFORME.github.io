<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System (Connected)</title>

<style>

body {
    margin: 0;
    background: #050505;
    color: #eee;
    font-family: "Times New Roman", serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 80px;
}

/* BACK BUTTON */
.back-arrow {
    position: fixed;
    top: 15px;
    left: 15px;
    font-size: 2rem;
    color: red;
    text-decoration: none;
    border: 1px solid rgba(255,0,0,0.5);
    padding: 6px 12px;
    border-radius: 6px;
}

/* SYSTEM */
.system {
    position: relative;
    width: 800px;
    height: 800px;
}

/* SVG LINES */
.lines {
    position: absolute;
    width: 100%;
    height: 100%;
}

/* SUN */
.sun {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 50px;
    height: 50px;
    background: gold;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 40px gold, 0 0 80px orange;
}

/* ORBITS */
.orbit {
    position: absolute;
    top: 50%;
    left: 50%;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.08);
    transform: translate(-50%, -50%);
}

/* PLANETS */
.planet {
    position: absolute;
    border-radius: 50%;
    transform: translate(-50%, -50%);
}

/* LABELS */
.label {
    position: absolute;
    font-size: 0.7rem;
    color: #ccc;
    transform: translate(-50%, -150%);
}

/* MAIN PLANETS */
.mercury { width:8px;height:8px;background:#aaa;box-shadow:0 0 6px #aaa; }
.venus { width:12px;height:12px;background:#ffd27a;box-shadow:0 0 8px #ffd27a; }
.earth { width:12px;height:12px;background:#44ff88;box-shadow:0 0 8px #44ff88; }
.mars { width:10px;height:10px;background:#ff4444;box-shadow:0 0 8px #ff4444; }
.jupiter { width:20px;height:20px;background:#ffbb88;box-shadow:0 0 10px #ffbb88; }
.saturn { width:18px;height:18px;background:#ffe096;box-shadow:0 0 10px #ffe096; }
.uranus { width:14px;height:14px;background:#66ffff;box-shadow:0 0 8px #66ffff; }
.neptune { width:14px;height:14px;background:#6666ff;box-shadow:0 0 8px #6666ff; }

/* DWARF */
.dwarf {
    width:10px;height:10px;
    border:2px solid red;
    border-radius:50%;
    background:transparent;
    box-shadow:0 0 8px rgba(255,0,0,0.6);
}

</style>
</head>

<body>

<a class="back-arrow" href="index.html">←</a>

<div class="system" id="system">

<svg class="lines" id="lines"></svg>

<div class="sun"></div>

<!-- ORBITS -->
<div class="orbit" style="width:120px;height:120px;"></div>
<div class="orbit" style="width:180px;height:180px;"></div>
<div class="orbit" style="width:240px;height:240px;"></div>
<div class="orbit" style="width:300px;height:300px;"></div>
<div class="orbit" style="width:420px;height:420px;"></div>
<div class="orbit" style="width:520px;height:520px;"></div>
<div class="orbit" style="width:620px;height:620px;"></div>
<div class="orbit" style="width:720px;height:720px;"></div>

<!-- PLANETS -->
<div id="mercury" class="planet mercury"></div>
<div id="venus" class="planet venus"></div>
<div id="earth" class="planet earth"></div>
<div id="mars" class="planet mars"></div>
<div id="jupiter" class="planet jupiter"></div>
<div id="saturn" class="planet saturn"></div>
<div id="uranus" class="planet uranus"></div>
<div id="neptune" class="planet neptune"></div>

<div id="pluto" class="planet dwarf"></div>
<div id="ceres" class="planet dwarf"></div>
<div id="eris" class="planet dwarf"></div>

<!-- LABELS -->
<div id="l_mercury" class="label">Mercury</div>
<div id="l_venus" class="label">Venus</div>
<div id="l_earth" class="label">Earth</div>
<div id="l_mars" class="label">Mars</div>
<div id="l_jupiter" class="label">Jupiter</div>
<div id="l_saturn" class="label">Saturn</div>
<div id="l_uranus" class="label">Uranus</div>
<div id="l_neptune" class="label">Neptune</div>
<div id="l_pluto" class="label">Pluto</div>
<div id="l_ceres" class="label">Ceres</div>
<div id="l_eris" class="label">Eris</div>

</div>

<script>

function daysSinceJ2000() {
    return (new Date() - new Date("2000-01-01T12:00:00Z")) / 86400000;
}

const bodies = [
    ["mercury",60,252.25,4.09],
    ["venus",90,181.97,1.60],
    ["earth",120,100.46,0.98],
    ["mars",150,355.43,0.52],
    ["jupiter",210,34.35,0.083],
    ["saturn",260,50.07,0.033],
    ["uranus",310,314.05,0.011],
    ["neptune",360,304.34,0.005],
    ["pluto",420,238,0.003],
    ["ceres",240,80,0.21],
    ["eris",480,204,0.0018]
];

function update(){

    const d = daysSinceJ2000();
    const positions = [];

    bodies.forEach(b=>{
        let angle=(b[2]+b[3]*d)%360;
        let rad=angle*Math.PI/180;

        let x=400+Math.cos(rad)*b[1];
        let y=400+Math.sin(rad)*b[1];

        document.getElementById(b[0]).style.left=x+"px";
        document.getElementById(b[0]).style.top=y+"px";

        document.getElementById("l_"+b[0]).style.left=x+"px";
        document.getElementById("l_"+b[0]).style.top=(y-10)+"px";

        positions.push({name:b[0],x,y});
    });

    drawConnections(positions);
}

/* -------- NEAREST CHAIN -------- */

function drawConnections(points){

    let svg=document.getElementById("lines");
    svg.innerHTML="";

    let visited=[];
    visited.push(points[0]);

    let remaining=[...points.slice(1)];

    while(remaining.length>0){

        let last=visited[visited.length-1];

        let nearestIndex=0;
        let minDist=Infinity;

        remaining.forEach((p,i)=>{
            let d=Math.hypot(p.x-last.x,p.y-last.y);
            if(d<minDist){
                minDist=d;
                nearestIndex=i;
            }
        });

        let next=remaining.splice(nearestIndex,1)[0];

        let line=document.createElementNS("http://www.w3.org/2000/svg","line");
        line.setAttribute("x1",last.x);
        line.setAttribute("y1",last.y);
        line.setAttribute("x2",next.x);
        line.setAttribute("y2",next.y);
        line.setAttribute("stroke","rgba(255,255,255,0.4)");
        line.setAttribute("stroke-width","1");

        svg.appendChild(line);

        visited.push(next);
    }
}

setInterval(update,1000);
update();

</script>

</body>
</html>
``
