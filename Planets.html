<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planetary System</title>

<style>

body {
    margin: 0;
    background: #050505;
    color: #eee;
    font-family: "Times New Roman", serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* BACK BUTTON */
.back-arrow {
    position: fixed;
    top: 15px;
    left: 15px;
    font-size: 2rem;
    color: red;
    text-decoration: none;
    border: 1px solid rgba(255,0,0,0.5);
    padding: 6px 12px;
    border-radius: 6px;
}

/* SYSTEM */
.system {
    position: relative;
    width: 600px;
    height: 600px;
}

/* SUN */
.sun {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 40px;
    height: 40px;
    background: gold;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 30px gold, 0 0 60px orange;
}

/* PLANET */
.planet {
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
}

.label {
    position: absolute;
    font-size: 0.7rem;
    color: #ccc;
    transform: translate(-50%, -150%);
    white-space: nowrap;
}

/* COLORS (distinct) */
.p1 { background:#ff6666; box-shadow:0 0 8px #ff6666; }
.p2 { background:#ffaa66; box-shadow:0 0 8px #ffaa66; }
.p3 { background:#ffff66; box-shadow:0 0 8px #ffff66; }
.p4 { background:#66ff66; box-shadow:0 0 8px #66ff66; }
.p5 { background:#66ffff; box-shadow:0 0 8px #66ffff; }
.p6 { background:#6666ff; box-shadow:0 0 8px #6666ff; }
.p7 { background:#aa66ff; box-shadow:0 0 8px #aa66ff; }
.p8 { background:#ff66ff; box-shadow:0 0 8px #ff66ff; }

</style>
</head>

<body>

<a class="back-arrow" href="index.html">←</a>

<div class="system">

    <div class="sun"></div>

    <!-- PLANETS -->
    <div id="p1" class="planet p1"></div>
    <div id="p2" class="planet p2"></div>
    <div id="p3" class="planet p3"></div>
    <div id="p4" class="planet p4"></div>
    <div id="p5" class="planet p5"></div>
    <div id="p6" class="planet p6"></div>
    <div id="p7" class="planet p7"></div>
    <div id="p8" class="planet p8"></div>

    <!-- LABELS -->
    <div id="l1" class="label">Planet 1</div>
    <div id="l2" class="label">Planet 2</div>
    <div id="l3" class="label">Planet 3</div>
    <div id="l4" class="label">Planet 4</div>
    <div id="l5" class="label">Planet 5</div>
    <div id="l6" class="label">Planet 6</div>
    <div id="l7" class="label">Planet 7</div>
    <div id="l8" class="label">Planet 8</div>

</div>

<script>

/* Simple orbit speeds (different for each planet) */
const speeds = [16, 14, 12, 10, 8, 6, 5, 4];
const radii  = [70, 100, 130, 160, 190, 220, 250, 280];

function move(id, labelId, angle, radius) {
    const rad = angle * Math.PI / 180;

    const x = 300 + Math.cos(rad) * radius;
    const y = 300 + Math.sin(rad) * radius;

    document.getElementById(id).style.left = x + "px";
    document.getElementById(id).style.top  = y + "px";

    document.getElementById(labelId).style.left = x + "px";
    document.getElementById(labelId).style.top  = (y - 10) + "px";
}

function update() {

    const t = Date.now() / 1000;

    for (let i = 0; i < 8; i++) {
        const angle = (t * speeds[i]) % 360;
        move("p"+(i+1), "l"+(i+1), angle, radii[i]);
    }
}

setInterval(update, 50);
update();

</script>

</body>
</html>
