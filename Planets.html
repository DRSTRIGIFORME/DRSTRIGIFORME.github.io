<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System Direction</title>

<style>

body {
    margin: 0;
    background: #050505;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 80px;
    font-family: "Times New Roman", serif;
    color: white;
}

/* BACK ARROW */
.back-arrow {
    position: fixed;
    top: 15px;
    left: 15px;
    font-size: 2rem;
    color: red;
    text-decoration: none;
    border: 1px solid rgba(255,0,0,0.5);
    padding: 6px 12px;
    border-radius: 6px;
    z-index: 999;
}

/* INFO TEXT */
#directionInfo {
    position: fixed;
    top: 70px;
    left: 20px;
    font-size: 1rem;
}

/* SYSTEM */
.system {
    position: relative;
    width: 800px;
    height: 800px;
}

/* SVG LINES */
.lines {
    position: absolute;
    width: 100%;
    height: 100%;
}

/* SUN */
.sun {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 40px;
    height: 40px;
    background: gold;
    border-radius: 50%;
    transform: translate(-50%, -50%);
}

/* PLANETS */
.planet {
    position: absolute;
    border-radius: 50%;
    transform: translate(-50%, -50%);
}

/* LABELS */
.label {
    position: absolute;
    font-size: 0.7rem;
    transform: translate(-50%, -140%);
}

/* PLANET COLORS */
.mercury { width:6px;height:6px;background:#aaa; }
.venus   { width:10px;height:10px;background:#ffd27a; }
.earth   { width:10px;height:10px;background:#44ff88; }
.mars    { width:8px;height:8px;background:#ff4444; }
.jupiter { width:16px;height:16px;background:#ffbb88; }
.saturn  { width:14px;height:14px;background:#ffe096; }
.uranus  { width:12px;height:12px;background:#66ffff; }
.neptune { width:12px;height:12px;background:#6666ff; }

/* DWARF */
.dwarf {
    width:8px;
    height:8px;
    border:2px solid red;
    background: transparent;
}

</style>
</head>

<body>

<a class="back-arrow" href="index.html">←</a>

<div id="directionInfo">Loading...</div>

<div class="system">

<svg class="lines" id="lines"></svg>

<div class="sun"></div>

<!-- PLANETS -->
<div id="mercury" class="planet mercury"></div>
<div id="venus" class="planet venus"></div>
<div id="earth" class="planet earth"></div>
<div id="mars" class="planet mars"></div>
<div id="jupiter" class="planet jupiter"></div>
<div id="saturn" class="planet saturn"></div>
<div id="uranus" class="planet uranus"></div>
<div id="neptune" class="planet neptune"></div>

<div id="pluto" class="planet dwarf"></div>
<div id="ceres" class="planet dwarf"></div>
<div id="eris" class="planet dwarf"></div>

<!-- MOON -->
<div id="moon" class="planet" style="width:5px;height:5px;background:#fff;"></div>

<!-- LABELS -->
<div id="l_mercury" class="label">Mercury</div>
<div id="l_venus" class="label">Venus</div>
<div id="l_earth" class="label">Earth</div>
<div id="l_mars" class="label">Mars</div>
<div id="l_jupiter" class="label">Jupiter</div>
<div id="l_saturn" class="label">Saturn</div>
<div id="l_uranus" class="label">Uranus</div>
<div id="l_neptune" class="label">Neptune</div>
<div id="l_pluto" class="label">Pluto</div>
<div id="l_ceres" class="label">Ceres</div>
<div id="l_eris" class="label">Eris</div>
<div id="l_moon" class="label">Moon</div>

</div>

<script>

/* DAYS SINCE J2000 */
function days() {
    return (Date.now() - Date.parse("2000-01-01T12:00:00Z")) / 86400000;
}

/* PLANET DATA */
const bodies = [
["mercury",60,252.25,4.09],
["venus",90,181.97,1.60],
["earth",120,100.46,0.98],
["mars",150,355.43,0.52],
["jupiter",210,34.35,0.083],
["saturn",260,50.07,0.033],
["uranus",310,314.05,0.011],
["neptune",360,304.34,0.005],
["pluto",420,238,0.003],
["ceres",240,80,0.21],
["eris",480,204,0.0018]
];

function move(id, x, y) {
    document.getElementById(id).style.left = x + "px";
    document.getElementById(id).style.top  = y + "px";

    const label = document.getElementById("l_" + id);
    if (label) {
        label.style.left = x + "px";
        label.style.top  = (y - 10) + "px";
    }
}

function update() {

    const d = days();
    let pos = [];

    /* PLANETS */
    bodies.forEach(b => {

        const angle = (b[2] + b[3] * d) % 360;
        const rad = angle * Math.PI / 180;

        const x = 400 + Math.cos(rad) * b[1];
        const y = 400 + Math.sin(rad) * b[1];

        move(b[0], x, y);

        pos.push({ name: b[0], x, y });
    });

    /* EARTH */
    const earth = pos.find(p => p.name === "earth");

    /* MOON (clean orbit) */
    const moonAngle = (d * 13) % 360;
    const mrad = moonAngle * Math.PI / 180;

    const mx = earth.x + Math.cos(mrad) * 18;
    const my = earth.y + Math.sin(mrad) * 18;

    move("moon", mx, my);

    /* DIRECTION VECTOR */
    const dx = mx - earth.x;
    const dy = my - earth.y;

    const dir = Math.atan2(dy, dx);

    /* FIND TARGET */
    let target = null;

    pos.forEach(p => {

        if (p.name === "earth") return;

        const dxp = p.x - earth.x;
        const dyp = p.y - earth.y;

        const ang = Math.atan2(dyp, dxp);

        let diff = Math.abs(ang - dir);
        if (diff > Math.PI) diff = Math.PI * 2 - diff;

        if (diff < 0.07) { // ~4 degrees tolerance
            target = p.name;
        }
    });

    document.getElementById("directionInfo").textContent =
        target ? "Pointing toward: " + target : "Pointing toward: nothing";

    /* DRAW RAY */
    const svg = document.getElementById("lines");
    svg.innerHTML = "";

    const length = 2000;

    const x2 = earth.x + Math.cos(dir) * length;
    const y2 = earth.y + Math.sin(dir) * length;

    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");

    line.setAttribute("x1", earth.x);
    line.setAttribute("y1", earth.y);
    line.setAttribute("x2", x2);
    line.setAttribute("y2", y2);
    line.setAttribute("stroke", "white");
    line.setAttribute("stroke-width", "2");

    svg.appendChild(line);
}

setInterval(update, 1000);
update();

</script>

</body>
</html>
