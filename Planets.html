<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planetary System</title>

<style>

body {
    margin: 0;
    background: #050505;
    color: #eee;
    font-family: "Times New Roman", serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* BACK BUTTON */
.back-arrow {
    position: fixed;
    top: 15px;
    left: 15px;
    font-size: 2rem;
    color: red;
    text-decoration: none;
    border: 1px solid rgba(255,0,0,0.5);
    padding: 6px 12px;
    border-radius: 6px;
    z-index: 999;
}

/* SYSTEM */
.system {
    position: relative;
    width: 600px;
    height: 600px;
}

/* SUN */
.sun {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 40px;
    height: 40px;
    background: gold;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 30px gold, 0 0 60px orange;
}

/* ORBITS */
.orbit {
    position: absolute;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

/* PLANETS */
.planet {
    position: absolute;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
}

/* COLORS */
#venus {
    background: #ffdd66;
    box-shadow: 0 0 12px #ffdd66;
}

#earth {
    background: #44ff88;
    box-shadow: 0 0 12px #44ff88;
}

#mars {
    background: #ff4444;
    box-shadow: 0 0 12px #ff4444;
}

/* ORBIT SIZES */
#orbitVenus {
    width: 160px;
    height: 160px;
}

#orbitEarth {
    width: 260px;
    height: 260px;
}

#orbitMars {
    width: 360px;
    height: 360px;
}

</style>
</head>

<body>

<a class="back-arrow" href="index.html">←</a>

<div class="system">

    <!-- SUN -->
    <div class="sun"></div>

    <!-- ORBITS -->
    <div id="orbitVenus" class="orbit"></div>
    <div id="orbitEarth" class="orbit"></div>
    <div id="orbitMars" class="orbit"></div>

    <!-- PLANETS -->
    <div id="venus" class="planet"></div>
    <div id="earth" class="planet"></div>
    <div id="mars" class="planet"></div>

</div>


<script>

// Days since J2000 epoch (Jan 1 2000)
function getDaysSinceJ2000() {
    const now = new Date();
    const J2000 = new Date("2000-01-01T12:00:00Z");
    return (now - J2000) / 86400000;
}

// Orbital elements (degrees + rates)
// simplified mean longitude models
const planets = {
    venus: {
        L0: 181.9798,      // base longitude
        rate: 1.60213034   // deg/day
    },
    earth: {
        L0: 100.4665,
        rate: 0.98564736
    },
    mars: {
        L0: 355.433,
        rate: 0.52403295
    }
};

function movePlanet(id, angle, radius) {
    const rad = angle * Math.PI / 180;
    const x = 300 + Math.cos(rad) * radius;
    const y = 300 + Math.sin(rad) * radius;

    const el = document.getElementById(id);
    el.style.left = x + "px";
    el.style.top = y + "px";
}

function update() {

    const d = getDaysSinceJ2000();

    const venusAngle =
        (planets.venus.L0 + planets.venus.rate * d) % 360;

    const earthAngle =
        (planets.earth.L0 + planets.earth.rate * d) % 360;

    const marsAngle =
        (planets.mars.L0 + planets.mars.rate * d) % 360;

    movePlanet("venus", venusAngle, 80);
    movePlanet("earth", earthAngle, 130);
    movePlanet("mars", marsAngle, 180);
}

setInterval(update, 50);
update();
``

</script>

</body>
</html>
