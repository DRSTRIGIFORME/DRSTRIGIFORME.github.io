<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ternary Cosmological Calendar</title>

<style>

body {
    margin: 0;
    background: #050505;
    color: #eee;
    font-family: "Times New Roman", serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
}

/* 🔴 BACK */
.back-arrow {
    position: fixed;
    top: 15px;
    left: 15px;
    font-size: 2rem;
    color: red;
    text-decoration: none;
    border: 1px solid rgba(255,0,0,0.5);
    padding: 6px 12px;
    border-radius: 6px;
    z-index: 999;
}

/* ========================= */
/* MAIN */
/* ========================= */

.container {
    position: relative;
    width: 700px;
    min-height: 950px;
    padding-top: 30px;
}

/* ========================= */
/* CIRCLE LIGHT FIELD */
/* ========================= */

.circle {
    position: relative;
    width: 500px;
    height: 500px;
    margin: auto;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.15);
    overflow: hidden;
}

/* cross lines */
.circle::before,
.circle::after {
    content: "";
    position: absolute;
    background: rgba(255,255,255,0.12);
}

.circle::before {
    width: 2px;
    height: 100%;
    left: 50%;
    top: 0;
}

.circle::after {
    height: 2px;
    width: 100%;
    top: 50%;
    left: 0;
}

/* SUN + MOON */
.sun,
.moon {
    position: absolute;
    width: 40px;
    height: 40px;
    margin-left: -20px;
    margin-top: -20px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2rem;
    transition: all 0.5s linear;
}

.sun { color: gold; }
.moon { color: silver; }

/* CENTER */
.center {
    position: absolute;
    top: 250px;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 320px;
}

.time {
    font-size: 4.5rem;
}

/* ========================= */
/* CALENDAR */
/* ========================= */

.calendar {
    margin-top: 40px;
    text-align: center;
}

.season {
    font-size: 2.2rem;
    color: #cc4444;
    letter-spacing: 0.2rem;
}

.day-number,
.week-info,
.weekday {
    margin-top: 10px;
}

/* ========================= */
/* WEEK GRID */
/* ========================= */

.week-grid {
    margin-top: 40px;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 10px;
}

.weekday-box {
    border: 1px solid rgba(255,255,255,0.1);
    padding: 12px;
    background: rgba(255,255,255,0.03);
}

.weekday-box.active {
    border: 1px solid rgba(255,215,0,0.7);
    box-shadow: 0 0 15px rgba(255,215,0,0.25);
}

/* SEASONS */
.season-wheel {
    margin-top: 50px;
    display: flex;
    justify-content: center;
    gap: 12px;
}

.season-node {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.12);
    display: flex;
    justify-content: center;
    align-items: center;
}

.season-node.active {
    border: 1px solid rgba(255,0,0,0.7);
    box-shadow: 0 0 20px rgba(255,0,0,0.25);
}

</style>
</head>

<body>

<a class="back-arrow" href="index.html">←</a>

<div class="container">

    <div class="circle" id="circle">
        <div class="sun" id="sun">☉</div>
        <div class="moon" id="moon">☽</div>
    </div>

    <div class="center">
        <div class="time" id="time">00:00:00</div>
    </div>

    <div class="calendar">
        <div class="season" id="seasonName">GEL</div>
        <div>Day <span id="seasonDay">1</span></div>
        <div>Week <span id="weekNum">1</span></div>
        <div id="weekdayName">Unday</div>
    </div>

    <div class="week-grid" id="weekGrid"></div>

    <div class="season-wheel">
        <div class="season-node" id="season0">Gel</div>
        <div class="season-node" id="season1">Sat</div>
        <div class="season-node" id="season2">Adol</div>
        <div class="season-node" id="season3">Mess</div>
        <div class="season-node" id="season4">Nix</div>
    </div>

</div>

<script>

const seasons = ["Gel","Sat","Adol","Mess","Nix"];

const weekdays = [
    "Saturday","Duday","Treday","Quday",
    "Kinday","Sesday","Sepday","Finday"
];

const symbols = ["Ⅰ","Ⅱ","Ⅲ","Ⅳ","Ⅴ","Ⅵ","Ⅶ","Ⅷ"];

const weekGrid = document.getElementById("weekGrid");

weekdays.forEach((d,i)=>{
    const el = document.createElement("div");
    el.className = "weekday-box";
    el.id = "weekday"+i;
    el.innerHTML = `<div>${d}</div><div>${symbols[i]}</div>`;
    weekGrid.appendChild(el);
});

function update(){

    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();

    const totalHours = h + m/60 + s/3600;

    const sunAngle = (totalHours/24)*360 - 90;

    move("sun", sunAngle, 245);
    move("moon", sunAngle+180, 245);

    // 🌞 + 🌙 LIGHT FIELD (FIXED CORRECT MODEL)

    const circle = document.getElementById("circle");

    const sunX = 50 + Math.cos(sunAngle*Math.PI/180)*50;
    const sunY = 50 + Math.sin(sunAngle*Math.PI/180)*50;

    const moonX = 50 + Math.cos((sunAngle+180)*Math.PI/180)*50;
    const moonY = 50 + Math.sin((sunAngle+180)*Math.PI/180)*50;

    circle.style.background = `
        radial-gradient(circle at ${sunX}% ${sunY}%,
            rgba(255,220,90,0.9),
            rgba(255,200,80,0.2),
            transparent 60%
        ),
        radial-gradient(circle at ${moonX}% ${moonY}%,
            rgba(90,120,255,0.35),
            rgba(30,60,160,0.25),
            transparent 60%
        ),
        #050714
    `;

    document.getElementById("time").textContent =
        String(h).padStart(2,"0")+":"+
        String(m).padStart(2,"0")+":"+
        String(s).padStart(2,"0");

    // season logic (unchanged core)
    const start = new Date(now.getFullYear(),0,0);
    const dayOfYear = Math.floor((now - start)/86400000);

    const seasonIndex = Math.floor((dayOfYear-1)/73);
    const season = seasons[seasonIndex] ?? "???";

    const seasonDay = ((dayOfYear-1)%73)+1;
    const week = Math.floor((seasonDay-1)/8)+1;
    const weekdayIndex = (seasonDay-1)%8;

    document.getElementById("seasonName").textContent = season;
    document.getElementById("seasonDay").textContent = seasonDay;
    document.getElementById("weekNum").textContent = week;
    document.getElementById("weekdayName").textContent = weekdays[weekdayIndex];

    weekdays.forEach((_,i)=>
        document.getElementById("weekday"+i)
        .classList.toggle("active", i===weekdayIndex)
    );

    seasons.forEach((_,i)=>
        document.getElementById("season"+i)
        .classList.toggle("active", i===seasonIndex)
    );
}

function move(id,angle,r){
    const rad = angle*Math.PI/180;
    const x = 250 + Math.cos(rad)*r;
    const y = 250 + Math.sin(rad)*r;

    document.getElementById(id).style.left = x+"px";
    document.getElementById(id).style.top = y+"px";
}

setInterval(update,1000);
update();

</script>

</body>
</html>
