<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PerKD Clock</title>

<style>

body {
    margin: 0;
    background: #050505;
    color: #eee;
    font-family: "Times New Roman", serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

/* BACK */
.back-arrow {
    position: fixed;
    top: 15px;
    left: 15px;
    font-size: 2rem;
    color: red;
    text-decoration: none;
}

/* CIRCLE */
.circle {
    position: relative;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.15);
}

/* SUN + MOON */
.sun,.moon {
    position: absolute;
    font-size: 2rem;
    transform: translate(-50%,-50%);
}

.sun { color: gold; }
.moon { color: silver; }

/* CENTER */
.center {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
}

.time { font-size:4rem; }
.phase { font-size:1.8rem; }

/* CALENDAR TEXT */
.calendar {
    margin-top:30px;
    text-align:center;
}

/* WEEK GRID */
.week-grid {
    display:grid;
    grid-template-columns:repeat(8,1fr);
    gap:6px;
    margin-top:20px;
}

.weekday-box {
    border:1px solid rgba(255,255,255,0.2);
    padding:8px;
}

.weekday-box.active {
    border:1px solid gold;
    box-shadow:0 0 10px gold;
}

/* SEASON WHEEL */
.season-wheel {
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:30px;
}

.season-node {
    width:70px;
    height:70px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.3);
    display:flex;
    justify-content:center;
    align-items:center;
}

.season-node.active {
    border:1px solid red;
    box-shadow:0 0 15px red;
}

</style>
</head>
<body>

<a class="back-arrow" href="index.html">←</a>

<div>

<div class="circle">
    <div id="sun" class="sun">☉</div>
    <div id="moon" class="moon">☽</div>

    <div class="center">
        <div id="time" class="time">00:00:00</div>
        <div id="phase" class="phase">I.M.</div>
    </div>
</div>

<!-- TEXT CALENDAR -->
<div class="calendar">
    <div id="seasonName"></div>
    <div>Day <span id="seasonDay">1</span></div>
    <div>Week <span id="weekNum">1</span></div>
    <div id="weekdayName"></div>
</div>

<!-- WEEK GRID -->
<div class="week-grid" id="weekGrid"></div>

<!-- SEASON WHEEL -->
<div class="season-wheel">
    <div class="season-node" id="season0">Gel</div>
    <div class="season-node" id="season1">Sat</div>
    <div class="season-node" id="season2">Adol</div>
    <div class="season-node" id="season3">Mess</div>
    <div class="season-node" id="season4">Nix</div>
</div>

</div>

<script>

const seasons = ["Gel","Sat","Adol","Mess","Nix"];

const weekdays = [
    "Saturday","Duday","Treday","Quday",
    "Kinday","Sesday","Sepday","Finday"
];

/* BUILD WEEK GRID */
weekdays.forEach((d,i)=>{
    const el=document.createElement("div");
    el.className="weekday-box";
    el.id="weekday"+i;
    el.textContent=d;
    document.getElementById("weekGrid").appendChild(el);
});

/* MOVE */
function move(id,angle,r){
    const rad=angle*Math.PI/180;
    const x=250+Math.cos(rad)*r;
    const y=250+Math.sin(rad)*r;
    document.getElementById(id).style.left=x+"px";
    document.getElementById(id).style.top=y+"px";
}

function update(){

    const now=new Date();

    /* NORMAL TIME */
    const h=now.getHours();
    const m=now.getMinutes();
    const s=now.getSeconds();

    const displayHour=(h%8)+1;

    document.getElementById("time").textContent =
        String(displayHour).padStart(2,"0")+":"+
        String(m).padStart(2,"0")+":"+
        String(s).padStart(2,"0");

    /* PHASE */
    let phase = h<8 ? "I.M." : h<16 ? "I.D." : "A.V.";
    document.getElementById("phase").textContent = phase;

    /* SUN / MOON */
    const totalSeconds = h*3600+m*60+s;
    const angle=(totalSeconds/86400)*360 - 90;

    move("sun",angle,220);
    move("moon",angle+180,220);

    /* DATE */
    const start=new Date(now.getFullYear(),0,0);
    const dayOfYear=Math.floor((now-start)/86400000);

    const seasonIndex=Math.floor((dayOfYear-1)/73);
    const season=seasons[seasonIndex] ?? "???";

    const seasonDay=((dayOfYear-1)%73)+1;
    const week=Math.floor((seasonDay-1)/8)+1;
    const weekdayIndex=(seasonDay-1)%8;

    document.getElementById("seasonName").textContent=season;
    document.getElementById("seasonDay").textContent=seasonDay;
    document.getElementById("weekNum").textContent=week;
    document.getElementById("weekdayName").textContent=weekdays[weekdayIndex];

    /* ✅ WEEKDAY HIGHLIGHT */
    weekdays.forEach((_,i)=>
        document.getElementById("weekday"+i)
        .classList.toggle("active",i===weekdayIndex)
    );
