<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ternary Cosmological Calendar</title>

<style>

body {
    margin: 0;
    background: #050505;
    color: #eee;
    font-family: "Times New Roman", serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
}

/* 🔴 BACK BUTTON */
.back-arrow {
    position: fixed;
    top: 15px;
    left: 15px;
    font-size: 2rem;
    color: red;
    text-decoration: none;
    border: 1px solid rgba(255,0,0,0.5);
    padding: 6px 12px;
    border-radius: 6px;
    transition: 0.2s;
    z-index: 999;
}

.back-arrow:hover {
    background: red;
    color: black;
    box-shadow: 0 0 15px rgba(255,0,0,0.5);
}

/* ========================= */
/* MAIN CONTAINER            */
/* ========================= */

.container {
    position: relative;
    width: 700px;
    min-height: 950px;
    padding-top: 30px;
}

/* ========================= */
/* CIRCLE WITH DYNAMIC LIGHT */
/* ========================= */

.circle {
    position: relative;
    width: 500px;
    height: 500px;
    margin: auto;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.15);
}

/* TIME RAY */
.time-ray {
    position: absolute;
    width: 2px;
    height: 250px;
    background: rgba(255, 60, 60, 0.35);
    top: 0;
    left: 50%;
    transform-origin: bottom center;
}

/* geometry lines */
.circle::before,
.circle::after {
    content: "";
    position: absolute;
    background: rgba(255,255,255,0.12);
}

.circle::before {
    width: 2px;
    height: 100%;
    left: 50%;
    top: 0;
}

.circle::after {
    height: 2px;
    width: 100%;
    top: 50%;
    left: 0;
}

/* SUN + MOON */
.sun,
.moon {
    position: absolute;
    width: 40px;
    height: 40px;
    margin-left: -20px;
    margin-top: -20px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2rem;
    transition: all 0.5s linear;
}

.sun {
    color: gold;
    text-shadow: 0 0 10px rgba(255,215,0,0.8),
                 0 0 20px rgba(255,215,0,0.5);
}

.moon {
    color: silver;
    text-shadow: 0 0 10px rgba(200,200,255,0.8),
                 0 0 20px rgba(200,200,255,0.5);
}

/* CENTER */
.center {
    position: absolute;
    top: 250px;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 320px;
}

.symbols {
    color: #aa0000;
    letter-spacing: 0.35rem;
    margin-bottom: 10px;
}

.time {
    font-size: 4.5rem;
    text-shadow: 0 0 20px rgba(255,0,0,0.35);
}

.phase {
    margin-top: 10px;
    font-size: 2rem;
}

.latin {
    margin-top: 5px;
    color: #888;
    font-style: italic;
}

/* CALENDAR */
.calendar {
    margin-top: 40px;
    text-align: center;
}

.season {
    font-size: 2.2rem;
    color: #cc4444;
    letter-spacing: 0.2rem;
    text-transform: uppercase;
}

.day-number {
    margin-top: 10px;
    font-size: 1.4rem;
}

.week-info {
    margin-top: 5px;
    color: #999;
}

.weekday {
    margin-top: 15px;
    font-size: 1.8rem;
    color: gold;
}

/* WEEK GRID */
.week-grid {
    margin-top: 40px;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 10px;
}

.weekday-box {
    border: 1px solid rgba(255,255,255,0.1);
    padding: 12px;
    background: rgba(255,255,255,0.03);
    transition: 0.3s;
}

.weekday-box.active {
    border: 1px solid rgba(255,215,0,0.7);
    box-shadow: 0 0 15px rgba(255,215,0,0.25);
    background: rgba(255,215,0,0.06);
}

/* SEASON WHEEL */
.season-wheel {
    margin-top: 50px;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

.season-node {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.12);
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(255,255,255,0.03);
}

.season-node.active {
    border: 1px solid rgba(255,0,0,0.7);
    box-shadow: 0 0 20px rgba(255,0,0,0.25);
    background: rgba(255,0,0,0.08);
}

</style>
</head>

<body>

<!-- 🔴 BACK ARROW -->
<a class="back-arrow" href="index.html">←</a>

<div class="container">

    <div class="circle">
        <div class="time-ray" id="timeRay"></div>

        <div class="sun" id="sun">☉</div>
        <div class="moon" id="moon">☽</div>
    </div>

    <div class="center">
        <div class="symbols">☉ ⟁ ☽</div>
        <div class="time" id="time">00:00:00</div>
        <div class="phase" id="phase">I.M.</div>
        <div class="latin" id="latin">In Mane</div>
    </div>

    <div class="calendar">
        <div class="SpecialDay" id="SpecialDay">
            <div id="SpecialDayName"></div>
            <div id="SpecialDayDesc"></div>
        </div>

        <div class="season" id="seasonName">GEL</div>

        <div class="day-number">
            Day <span id="seasonDay">1</span>
        </div>

        <div class="week-info">
            Week <span id="weekNum">1</span>
        </div>

        <div class="weekday" id="weekdayName">Unday</div>
    </div>

    <div class="week-grid" id="weekGrid"></div>

    <div class="season-wheel">
        <div class="season-node" id="season0">Gel</div>
        <div class="season-node" id="season1">Sat</div>
        <div class="season-node" id="season2">Adol</div>
        <div class="season-node" id="season3">Mess</div>
        <div class="season-node" id="season4">Nix</div>
    </div>

</div>

<script>
// (your existing JS stays unchanged — nothing else needed)
</script>

</body>
</html>
