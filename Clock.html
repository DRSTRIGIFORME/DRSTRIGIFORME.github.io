<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PerKD Clock</title>

<style>

body {
    margin: 0;
    background: #050505;
    color: #eee;
    font-family: "Times New Roman", serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

/* BACK BUTTON */
.back-arrow {
    position: fixed;
    top: 15px;
    left: 15px;
    font-size: 2rem;
    color: red;
    text-decoration: none;
    border: 1px solid rgba(255,0,0,0.5);
    padding: 6px 12px;
    border-radius: 6px;
    z-index: 999;
}

/* CIRCLE */
.circle {
    position: relative;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.15);
    overflow: hidden;
}

/* SUN + MOON */
.sun, .moon {
    position: absolute;
    width: 40px;
    height: 40px;
    margin-left: -20px;
    margin-top: -20px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2rem;
}

.sun { color: gold; }
.moon { color: silver; }

/* CENTER */
.center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
}

.time { font-size: 4rem; }
.phase { font-size: 1.8rem; }
.latin { color: #888; }

/* CALENDAR */
.calendar {
    margin-top: 30px;
    text-align: center;
}

</style>
</head>

<body>

<a class="back-arrow" href="index.html">←</a>

<div>

<div class="circle" id="circle">
    <div class="sun" id="sun">☉</div>
    <div class="moon" id="moon">☽</div>

    <div class="center">
        <div id="time" class="time">00:00:00</div>
        <div id="phase" class="phase">I.M.</div>
        <div id="latin" class="latin">In Mane</div>
    </div>
</div>

<div class="calendar">
    <div id="seasonName"></div>
    <div>Day <span id="seasonDay"></span></div>
    <div>Week <span id="weekNum"></span></div>
    <div id="weekdayName"></div>
</div>

</div>

<script>

/* SYSTEM DATA */
const seasons = ["Gel","Sat","Adol","Mess","Nix"];

const weekdays = [
    "Saturday","Duday","Treday","Quday",
    "Kinday","Sesday","Sepday","Finday"
];

/* MOVE FUNCTION */
function move(id, angle, r) {
    const rad = angle * Math.PI / 180;

    const x = 250 + Math.cos(rad) * r;
    const y = 250 + Math.sin(rad) * r;

    document.getElementById(id).style.left = x + "px";
    document.getElementById(id).style.top  = y + "px";
}

function update() {

    const now = new Date();

    /* ✅ NORMAL TIME */
    const hour = now.getHours();
    const minute = now.getMinutes();
    const second = now.getSeconds();

    /* ✅ PHASE */
    let phase = "", latin = "";

    if (hour < 8) {
        phase = "I.M.";
        latin = "In Mane";
    } else if (hour < 16) {
        phase = "I.D.";
        latin = "In Die";
    } else {
        phase = "A.V.";
        latin = "Ad Vespereum";
    }

    document.getElementById("phase").textContent = phase;
    document.getElementById("latin").textContent = latin;

    /* ✅ 1–8 HOURS */
    const displayHour = (hour % 8) + 1;

    document.getElementById("time").textContent =
        String(displayHour).padStart(2,"0") + ":" +
        String(minute).padStart(2,"0") + ":" +
        String(second).padStart(2,"0");

    /* ✅ SUN + MOON POSITION */
    const totalSeconds =
        hour*3600 + minute*60 + second;

    const angle = (totalSeconds / 86400) * 360 - 90;

    move("sun", angle, 220);
    move("moon", angle + 180, 220);

    /* ✅ LIGHT */
    const circle = document.getElementById("circle");

    const sunX = 50 + Math.cos(angle*Math.PI/180)*50;
    const sunY = 50 + Math.sin(angle*Math.PI/180)*50;

    const moonX = 50 + Math.cos((angle+180)*Math.PI/180)*50;
    const moonY = 50 + Math.sin((angle+180)*Math.PI/180)*50;

    circle.style.background = `
        radial-gradient(circle at ${sunX}% ${sunY}%,
            rgba(255,220,90,0.9),
            rgba(255,200,80,0.2),
            transparent 60%
        ),
        radial-gradient(circle at ${moonX}% ${moonY}%,
            rgba(90,120,255,0.35),
            rgba(30,60,160,0.2),
            transparent 60%
        ),
        #050714
    `;

    /* ✅ DATE (UNCHANGED) */
    const start = new Date(now.getFullYear(),0,0);
    const dayOfYear = Math.floor((now - start)/86400000);

    const seasonIndex = Math.floor((dayOfYear-1)/73);
    const season = seasons[seasonIndex] ?? "???";

    const seasonDay = ((dayOfYear-1)%73)+1;
    const week = Math.floor((seasonDay-1)/8)+1;
    const weekday = weekdays[(seasonDay-1)%8];

    document.getElementById("seasonName").textContent =
        season;

    document.getElementById("seasonDay").textContent =
        seasonDay;

    document.getElementById("weekNum").textContent =
        week;

    document.getElementById("weekdayName").textContent =
        weekday;
}

setInterval(update, 1000);
update();

</script>

</body>
</html>
