<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ternary Cosmological Calendar</title>

<style>

body {
    margin: 0;
    background: #050505;
    color: #eee;
    font-family: "Times New Roman", serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
}

.back-arrow {
    position: fixed;
    top: 15px;
    left: 15px;
    font-size: 2rem;
    color: red;
    text-decoration: none;
    border: 1px solid rgba(255,0,0,0.5);
    padding: 6px 12px;
    border-radius: 6px;
    z-index: 999;
}

/* CIRCLE */
.circle {
    position: relative;
    width: 500px;
    height: 500px;
    margin: auto;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.15);
    transition: background 0.3s linear;
}

/* geometry */
.circle::before,
.circle::after {
    content: "";
    position: absolute;
    background: rgba(255,255,255,0.12);
}

.circle::before {
    width: 2px;
    height: 100%;
    left: 50%;
    top: 0;
}

.circle::after {
    height: 2px;
    width: 100%;
    top: 50%;
    left: 0;
}

/* SUN + MOON */
.sun,
.moon {
    position: absolute;
    width: 40px;
    height: 40px;
    margin-left: -20px;
    margin-top: -20px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2rem;
    transition: all 0.5s linear;
}

.sun { color: gold; }
.moon { color: silver; }

/* CENTER */
.center {
    position: absolute;
    top: 250px;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 320px;
}

.time { font-size: 4.5rem; }

/* other styles unchanged (omitted for brevity but still valid) */

</style>
</head>

<body>

<a class="back-arrow" href="index.html">←</a>

<div class="circle" id="circle">
    <div class="sun" id="sun">☉</div>
    <div class="moon" id="moon">☽</div>
</div>

<div class="center">
    <div class="time" id="time">00:00:00</div>
</div>

<script>

function update() {

    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();

    const totalHours = h + m/60 + s/3600;

    // 🌞 SUN POSITION
    const sunAngle = (totalHours / 24) * 360 - 90;

    // 🌙 MOON OPPOSITE
    const moonAngle = sunAngle + 180;

    move("sun", sunAngle, 245);
    move("moon", moonAngle, 245);

    // =========================
    // 🌈 LIGHT FIELD BASED ON SUN + MOON
    // =========================

    const circle = document.getElementById("circle");

    circle.style.background = `
        conic-gradient(
            from ${sunAngle}deg,

            /* night side (moon influence) */
            #0a0f2a,
            #0a1a4a,

            /* transition into sunrise */
            #1a2f7a,

            /* SUN ZONE */
            #f7d14a,
            #ffe680,
            #f7d14a,

            /* transition back to night */
            #1a2f7a,
            #0a1a4a,
            #0a0f2a
        )
    `;

    document.getElementById("time").textContent =
        String(Math.floor(totalHours)).padStart(2,"0") + ":" +
        String(m).padStart(2,"0") + ":" +
        String(s).padStart(2,"0");
}

function move(id, angle, radius) {
    const r = angle * Math.PI / 180;
    const x = 250 + Math.cos(r) * radius;
    const y = 250 + Math.sin(r) * radius;

    const el = document.getElementById(id);
    el.style.left = x + "px";
    el.style.top = y + "px";
}

setInterval(update, 1000);
update();

</script>

</body>
</html>
