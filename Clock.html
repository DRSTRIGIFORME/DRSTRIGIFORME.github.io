<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PerKD Clock</title>

<style>

body {
    margin: 0;
    background: #050505;
    color: #eee;
    font-family: "Times New Roman", serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

/* BACK */
.back-arrow {
    position: fixed;
    top: 15px;
    left: 15px;
    font-size: 2rem;
    color: red;
    text-decoration: none;
}

/* CIRCLE */
.circle {
    position: relative;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.15);
    overflow: hidden;
}

/* SUN + MOON */
.sun, .moon {
    position: absolute;
    width: 40px;
    height: 40px;
    margin-left: -20px;
    margin-top: -20px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2rem;
}

.sun { color: gold; }
.moon { color: silver; }

/* CENTER */
.center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
}

.time { font-size: 4rem; }
.phase { font-size: 1.8rem; }
.latin { color: #888; }

/* WEEK GRID */
.week-grid {
    margin-top: 30px;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
}

.weekday-box {
    border: 1px solid rgba(255,255,255,0.2);
    padding: 8px;
    text-align: center;
}

.weekday-box.active {
    border: 1px solid gold;
    box-shadow: 0 0 10px gold;
}

/* SEASONS */
.season-wheel {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    gap: 10px;
}

.season-node {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.3);
    display: flex;
    justify-content: center;
    align-items: center;
}

.season-node.active {
    border: 1px solid red;
    box-shadow: 0 0 15px red;
}

</style>
</head>

<body>

<a class="back-arrow" href="index.html">←</a>

<div>

<div class="circle" id="circle">

    <div class="sun" id="sun">☉</div>
    <div class="moon" id="moon">☽</div>

    <div class="center">
        <div id="time" class="time">00:00:00</div>
        <div id="phase" class="phase">I.M.</div>
        <div id="latin" class="latin">In Mane</div>
    </div>

</div>

<!-- TEXT -->
<div style="text-align:center; margin-top:20px;">
    <div id="seasonName">Gel</div>
    <div>Day <span id="seasonDay">1</span></div>
    <div>Week <span id="weekNum">1</span></div>
    <div id="weekdayName">Saturday</div>
</div>

<!-- WEEK -->
<div class="week-grid" id="weekGrid"></div>

<!-- SEASONS -->
<div class="season-wheel">
    <div class="season-node" id="season0">Gel</div>
    <div class="season-node" id="season1">Sat</div>
    <div class="season-node" id="season2">Adol</div>
    <div class="season-node" id="season3">Mess</div>
    <div class="season-node" id="season4">Nix</div>
</div>

</div>

<script>

/* DATA */
const seasons = ["Gel","Sat","Adol","Mess","Nix"];

const weekdays = [
    "Saturday","Duday","Treday","Quday",
    "Kinday","Sesday","Sepday","Finday"
];

/* BUILD GRID */
const weekGrid = document.getElementById("weekGrid");

weekdays.forEach((d,i)=>{
    const el = document.createElement("div");
    el.className = "weekday-box";
    el.id = "weekday"+i;
    el.textContent = d;
    weekGrid.appendChild(el);
});

/* MOVE */
function move(id, angle, r) {
    const rad = angle * Math.PI / 180;
    const x = 250 + Math.cos(rad)*r;
    const y = 250 + Math.sin(rad)*r;

    const el = document.getElementById(id);
    el.style.left = x + "px";
    el.style.top = y + "px";
}

/* UPDATE */
function update(){

    const now = new Date();

    const h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();

    /* TIME */
    const displayHour = (h % 8) + 1;

    document.getElementById("time").textContent =
        String(displayHour).padStart(2,"0") + ":" +
        String(m).padStart(2,"0") + ":" +
        String(s).padStart(2,"0");

    /* PHASE */
    let phase = "", latin = "";

    if (h < 8) { phase = "I.M."; latin = "In Mane"; }
    else if (h < 16) { phase = "I.D."; latin = "In Die"; }
    else { phase = "A.V."; latin = "Ad Vespereum"; }

    document.getElementById("phase").textContent = phase;
    document.getElementById("latin").textContent = latin;

    /* SUN + MOON */
    const totalSeconds = h*3600 + m*60 + s;
    const angle = (totalSeconds / 86400)*360 - 90;

    move("sun", angle, 220);
    move("moon", angle + 180, 220);

    /* GRADIENT */
    const circle = document.getElementById("circle");

    const sunX = 50 + Math.cos(angle*Math.PI/180)*50;
    const sunY = 50 + Math.sin(angle*Math.PI/180)*50;

    const moonX = 50 + Math.cos((angle+180)*Math.PI/180)*50;
    const moonY = 50 + Math.sin((angle+180)*Math.PI/180)*50;

    circle.style.background = `
        radial-gradient(circle at ${sunX}% ${sunY}%,
            rgba(255,220,90,0.9),
            rgba(255,200,80,0.2),
            transparent 60%
        ),
        radial-gradient(circle at ${moonX}% ${moonY}%,
            rgba(90,120,255,0.35),
            rgba(30,60,160,0.2),
            transparent 60%
        ),
        #050714
    `;

    /* DATE */
    const start = new Date(now.getFullYear(),0,0);
    const dayOfYear = Math.floor((now - start)/86400000);

    const seasonIndex = Math.floor((dayOfYear-1)/73);
    const seasonDay = ((dayOfYear-1)%73)+1;
    const weekdayIndex = (seasonDay-1)%8;
    const week = Math.floor((seasonDay-1)/8)+1;

    document.getElementById("seasonName").textContent = seasons[seasonIndex];
    document.getElementById("seasonDay").textContent = seasonDay;
    document.getElementById("weekNum").textContent = week;
    document.getElementById("weekdayName").textContent = weekdays[weekdayIndex];

    /* HIGHLIGHTS */
    weekdays.forEach((_,i)=>
        document.getElementById("weekday"+i)
        .classList.toggle("active", i===weekdayIndex)
    );

    seasons.forEach((_,i)=>
        document.getElementById("season"+i)
        .classList.toggle("active", i===seasonIndex)
    );
}

setInterval(update,1000);
update();

</script>

</body>
</html>
``
